
services:
  - type: web
    name: heatwave-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heatwave-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        value: "dummy"
      - key: TWILIO_AUTH_TOKEN
        value: "dummy"
      - key: TWILIO_FROM_NUMBER
        value: "dummy"

databases:
  - name: heatwave-db
    plan: free
    databaseName: heatwave_ews
    user: heatwave
