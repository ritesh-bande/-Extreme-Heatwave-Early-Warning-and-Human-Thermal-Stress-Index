services:
  # ─── PostgreSQL + PostGIS ───
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatwave -d heatwave_ews"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ─── React + Vite Frontend ───
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
